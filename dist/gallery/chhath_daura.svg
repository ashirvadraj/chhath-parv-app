<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1A0500"/>
    </radialGradient>
    <linearGradient id="bambooWeave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="caneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Aura Glow behind Daura -->
  <circle cx="250" cy="270" r="180" fill="#B45309" opacity="0.3"/>

  <!-- Sugarcanes (ईख) Standing Behind Daura -->
  <path d="M120 400 L170 80" stroke="url(#caneGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M140 400 L200 60" stroke="url(#caneGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M360 400 L300 60" stroke="url(#caneGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M380 400 L330 80" stroke="url(#caneGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Sugarcane Leaves -->
  <path d="M200 60 Q170 30 140 40 M200 60 Q230 20 250 35 M300 60 Q340 30 360 45" stroke="#4ADE80" stroke-width="6" fill="none"/>

  <!-- Bamboo Daura (Basket) Body -->
  <ellipse cx="250" cy="380" rx="170" ry="30" fill="#78350F" stroke="#F59E0B" stroke-width="4"/>
  <path d="M80 380 Q100 290 250 290 Q400 290 420 380 Z" fill="url(#bambooWeave)" stroke="#92400E" stroke-width="4"/>
  
  <!-- Bamboo Weave Pattern Lines -->
  <path d="M120 380 Q140 310 250 300 Q360 310 380 380" stroke="#78350F" stroke-width="2" fill="none"/>
  <path d="M150 380 Q170 330 250 320 Q330 330 350 380" stroke="#78350F" stroke-width="2" fill="none"/>
  <path d="M180 380 Q190 350 250 340 Q310 350 320 380" stroke="#78350F" stroke-width="2" fill="none"/>

  <!-- Holy Offerings in Daura -->
  <!-- Whole Banana Bunch (केला का घौद) -->
  <g transform="translate(130, 240)">
    <path d="M20 20 Q40 5 60 15 Q40 40 20 20 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
    <path d="M35 15 Q60 0 80 15 Q60 45 35 15 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
    <path d="M55 18 Q80 5 100 20 Q80 50 55 18 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
  </g>

  <!-- Sacred Coconut with Coir (जटा वाला नारियल) -->
  <ellipse cx="250" cy="270" rx="35" ry="42" fill="#78350F" stroke="#92400E" stroke-width="3"/>
  <path d="M250 230 Q260 210 250 195 Q240 210 250 230 Z" fill="#A16207"/>
  <ellipse cx="250" cy="270" rx="10" ry="12" fill="#B45309" stroke="#EAB308" stroke-width="2"/>

  <!-- Red Sindoor Sacred Swastik on Daura -->
  <g transform="translate(250, 350) scale(0.6)">
    <path d="M-30 0 L30 0 M0 -30 L0 30 M-30 -30 L-30 0 M30 30 L30 0 M-30 30 L0 30 M30 -30 L0 -30" 
          stroke="#DC2626" stroke-width="6" stroke-linecap="square" fill="none"/>
  </g>

  <!-- Giant Daura Lemons and Apples -->
  <circle cx="340" cy="290" r="24" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
  <circle cx="170" cy="290" r="22" fill="#DC2626" stroke="#B91C1C" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="20" y="20" width="220" height="42" rx="12" fill="#000000" opacity="0.6"/>
  <text x="35" y="47" fill="#FEF08A" font-size="18" font-family="sans-serif" font-weight="bold">बांस का पावन दउरा</text>
</svg>