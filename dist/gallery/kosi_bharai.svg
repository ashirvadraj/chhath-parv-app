<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="nightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="60%" stop-color="#0F0728"/>
      <stop offset="100%" stop-color="#050110"/>
    </radialGradient>
    <radialGradient id="kosiLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EA580C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" fill="url(#nightGlow)"/>

  <!-- Massive Golden Light Glow from 24 Diyas -->
  <circle cx="250" cy="310" r="210" fill="url(#kosiLight)"/>

  <!-- Four Sugarcanes tied at top into a Mandap (कूप / मंडप) -->
  <path d="M120 440 L250 80" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
  <path d="M180 440 L250 80" stroke="#16A34A" stroke-width="12" stroke-linecap="round"/>
  <path d="M320 440 L250 80" stroke="#16A34A" stroke-width="12" stroke-linecap="round"/>
  <path d="M380 440 L250 80" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
  <!-- Sugarcane Top Leaves & Red Ribbon -->
  <circle cx="250" cy="80" r="14" fill="#DC2626"/>
  <path d="M250 80 Q210 50 180 60 M250 80 Q290 50 320 60 M250 80 Q250 40 240 30" stroke="#4ADE80" stroke-width="5" fill="none"/>

  <!-- Clay Elephant (माटी का हाथी / कोसी मूरत) -->
  <g transform="translate(250, 310)">
    <ellipse cx="0" cy="10" rx="45" ry="35" fill="#78350F" stroke="#92400E" stroke-width="3"/>
    <circle cx="-35" cy="-5" r="22" fill="#78350F"/>
    <path d="M-45 -5 Q-65 10 -55 35 Q-45 35 -40 15" fill="#78350F"/>
    <circle cx="0" cy="-28" r="12" fill="#B45309"/>
    <!-- Top Diya on Elephant -->
    <ellipse cx="0" cy="-40" rx="14" ry="5" fill="#B45309"/>
    <path d="M0 -40 Q3 -55 0 -65 Q-3 -55 0 -40 Z" fill="#FEF08A"/>
  </g>

  <!-- Circular Ring of Earthen Diyas (24 कोसी दीये) -->
  <g transform="translate(250, 380)">
    <!-- Front Diya Row -->
    <g transform="translate(-110, -10)">
      <ellipse cx="0" cy="0" rx="12" ry="5" fill="#78350F"/><path d="M0 0 Q3 -15 0 -22 Q-3 -15 0 0 Z" fill="#FEF08A"/><circle cx="0" cy="-10" r="3" fill="#EA580C"/>
    </g>
    <g transform="translate(-60, 10)">
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="#78350F"/><path d="M0 0 Q3 -18 0 -25 Q-3 -18 0 0 Z" fill="#FEF08A"/><circle cx="0" cy="-11" r="4" fill="#EA580C"/>
    </g>
    <g transform="translate(0, 15)">
      <ellipse cx="0" cy="0" rx="16" ry="7" fill="#78350F"/><path d="M0 0 Q4 -22 0 -30 Q-4 -22 0 0 Z" fill="#FEF08A"/><circle cx="0" cy="-14" r="5" fill="#EA580C"/>
    </g>
    <g transform="translate(60, 10)">
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="#78350F"/><path d="M0 0 Q3 -18 0 -25 Q-3 -18 0 0 Z" fill="#FEF08A"/><circle cx="0" cy="-11" r="4" fill="#EA580C"/>
    </g>
    <g transform="translate(110, -10)">
      <ellipse cx="0" cy="0" rx="12" ry="5" fill="#78350F"/><path d="M0 0 Q3 -15 0 -22 Q-3 -15 0 0 Z" fill="#FEF08A"/><circle cx="0" cy="-10" r="3" fill="#EA580C"/>
    </g>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="20" width="220" height="42" rx="12" fill="#000000" opacity="0.6"/>
  <text x="35" y="47" fill="#FEF08A" font-size="18" font-family="sans-serif" font-weight="bold">घाट पर कोसी भरना</text>
</svg>