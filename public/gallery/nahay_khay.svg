<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="nkhBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>
    <linearGradient id="brassPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#nkhBg)"/>

  <!-- Sacred Clean Ground / Rangoli Glow -->
  <circle cx="250" cy="270" r="200" fill="#CA8A04" opacity="0.15"/>

  <!-- Pure Brass Thali (कांसा / पीतल की थाली) -->
  <circle cx="250" cy="270" r="180" fill="url(#brassPlate)" stroke="#CA8A04" stroke-width="6"/>
  <circle cx="250" cy="270" r="168" fill="#FEF08A" stroke="#A16207" stroke-width="2" opacity="0.9"/>

  <!-- Steaming Rice (अरवा चावल का भात) -->
  <g transform="translate(250, 270)">
    <circle cx="0" cy="0" r="65" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#F8FAFC"/>
    <!-- Fresh Tulsi Dal on Rice -->
    <path d="M0 -5 Q8 -15 0 -22 Q-8 -15 0 -5 Z" fill="#16A34A"/>
    <path d="M0 -12 Q12 -12 18 -18 Q12 -22 0 -12 Z" fill="#15803D"/>
    <path d="M0 -12 Q-12 -12 -18 -18 Q-12 -22 0 -12 Z" fill="#15803D"/>
  </g>

  <!-- Pure Bottle Gourd Curry (सेंधा नमक में कद्दू की सब्जी) -->
  <g transform="translate(170, 180)">
    <circle cx="0" cy="0" r="42" fill="#EAB308" stroke="#A16207" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="#84CC16"/>
    <circle cx="-10" cy="-8" r="12" fill="#65A30D"/>
    <circle cx="12" cy="6" r="14" fill="#65A30D"/>
    <circle cx="-5" cy="12" r="10" fill="#4D7C0F"/>
  </g>

  <!-- Chana Dal with Ghee (चना दाल) -->
  <g transform="translate(330, 180)">
    <circle cx="0" cy="0" r="42" fill="#EAB308" stroke="#A16207" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="#F59E0B"/>
    <circle cx="-6" cy="-6" r="6" fill="#D97706"/>
    <circle cx="10" cy="8" r="7" fill="#D97706"/>
    <circle cx="8" cy="-8" r="5" fill="#B45309"/>
  </g>

  <!-- Pure Sendha Salt & Ginger (सेंधा नमक व आदि) -->
  <g transform="translate(250, 390)">
    <ellipse cx="0" cy="0" rx="35" ry="18" fill="#FDE047" stroke="#CA8A04" stroke-width="2"/>
    <circle cx="-10" cy="0" r="7" fill="#FFFFFF"/>
    <circle cx="12" cy="0" r="8" fill="#D97706"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="20" width="220" height="42" rx="12" fill="#000000" opacity="0.6"/>
  <text x="35" y="47" fill="#FEF08A" font-size="18" font-family="sans-serif" font-weight="bold">नहाय-खाय कद्दू-भात</text>
</svg>