<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0F051D"/>
    </radialGradient>
    <linearGradient id="bambooSoop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#darkBg)"/>

  <!-- Divine Aura -->
  <circle cx="250" cy="270" r="190" fill="#F59E0B" opacity="0.25"/>

  <!-- Sacred Bamboo Soop Shape -->
  <path d="M100 130 L400 130 L360 410 Q250 450 140 410 Z" fill="url(#bambooSoop)" stroke="#78350F" stroke-width="6"/>
  <!-- Soop Rim -->
  <path d="M90 130 L410 130" stroke="#B45309" stroke-width="12" stroke-linecap="round"/>

  <!-- Vermilion Swastik on Soop -->
  <g transform="translate(250, 360) scale(0.65)">
    <path d="M-30 0 L30 0 M0 -30 L0 30 M-30 -30 L-30 0 M30 30 L30 0 M-30 30 L0 30 M30 -30 L0 -30" 
          stroke="#E11D48" stroke-width="7" stroke-linecap="square" fill="none"/>
    <circle cx="-15" cy="-15" r="3" fill="#E11D48"/>
    <circle cx="15" cy="-15" r="3" fill="#E11D48"/>
    <circle cx="-15" cy="15" r="3" fill="#E11D48"/>
    <circle cx="15" cy="15" r="3" fill="#E11D48"/>
  </g>

  <!-- Five Holy Offerings on Soop -->
  <!-- 1. Thekua (ठेकुआ) -->
  <ellipse cx="170" cy="220" rx="28" ry="18" fill="#B45309" stroke="#78350F" stroke-width="3"/>
  <ellipse cx="170" cy="220" rx="20" ry="12" fill="#D97706"/>
  
  <!-- 2. Sacred Coconut with Water -->
  <ellipse cx="250" cy="220" rx="34" ry="42" fill="#713F12" stroke="#451A03" stroke-width="3"/>
  <path d="M245 180 L255 180 L250 160 Z" fill="#A16207"/>

  <!-- 3. Ripe Banana -->
  <path d="M300 200 Q330 180 350 200 Q330 230 300 200 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>
  <path d="M310 220 Q340 200 360 220 Q340 250 310 220 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>

  <!-- 4. Sacred Diya Burning on Soop -->
  <g transform="translate(250, 285)">
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="#78350F" stroke="#B45309" stroke-width="2"/>
    <path d="M0 0 Q6 -26 0 -38 Q-6 -26 0 0 Z" fill="#FEF08A"/>
    <circle cx="0" cy="-16" r="6" fill="#F97316"/>
  </g>

  <!-- 5. Fresh Green Lemon (डाभ नींबू) -->
  <circle cx="180" cy="280" r="22" fill="#84CC16" stroke="#4D7C0F" stroke-width="2"/>

  <!-- 6. Apple (सेब) -->
  <circle cx="320" cy="280" r="24" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="20" y="20" width="220" height="42" rx="12" fill="#000000" opacity="0.6"/>
  <text x="35" y="47" fill="#FEF08A" font-size="18" font-family="sans-serif" font-weight="bold">बांस का पावन सूप</text>
</svg>