<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="40%" stop-color="#C2410C"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="40%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#DC2626" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="500" height="300" fill="url(#skyGrad)"/>

  <!-- Holy River Ganges -->
  <rect y="280" width="500" height="220" fill="url(#waterGrad)"/>

  <!-- Sunset Sun with Radiance -->
  <circle cx="250" cy="240" r="140" fill="url(#sunGlow)"/>
  <circle cx="250" cy="240" r="65" fill="#FEF08A"/>

  <!-- Sun Reflection on Sacred Water -->
  <path d="M220 280 L280 280 L320 500 L180 500 Z" fill="#FBBF24" opacity="0.3"/>
  <ellipse cx="250" cy="300" rx="45" ry="5" fill="#FEF08A" opacity="0.8"/>
  <ellipse cx="250" cy="325" rx="75" ry="7" fill="#FDE047" opacity="0.7"/>
  <ellipse cx="250" cy="360" rx="110" ry="9" fill="#F59E0B" opacity="0.6"/>
  <ellipse cx="250" cy="410" rx="140" ry="11" fill="#EA580C" opacity="0.5"/>

  <!-- Devotee Offering Arghya Silhouette with Soop -->
  <path d="M190 320 Q205 270 215 250 Q225 240 240 245 Q250 250 255 270 Q270 290 280 340 Z" fill="#2E1065" opacity="0.95"/>
  <!-- Devotee Hands holding Soop -->
  <path d="M210 270 L195 230 L260 210 L280 255 Z" fill="url(#soopGrad)"/>
  <ellipse cx="230" cy="220" rx="40" ry="15" fill="#B45309" stroke="#FEF08A" stroke-width="2"/>
  
  <!-- Fruits and Prasad on Soop -->
  <circle cx="215" cy="218" r="8" fill="#E11D48"/>
  <circle cx="230" cy="216" r="10" fill="#EAB308"/>
  <circle cx="245" cy="219" r="9" fill="#16A34A"/>
  <!-- Diya on Soop with Flame -->
  <ellipse cx="230" cy="210" rx="7" ry="3" fill="#78350F"/>
  <path d="M230 210 Q233 198 230 192 Q227 198 230 210 Z" fill="#FEF08A"/>
  <circle cx="230" cy="198" r="3" fill="#EF4444"/>

  <!-- Floating Diyas in River -->
  <g transform="translate(100, 350)">
    <ellipse cx="0" cy="0" rx="15" ry="6" fill="#78350F"/>
    <path d="M0 0 Q3 -15 0 -22 Q-3 -15 0 0 Z" fill="#FEF08A"/>
    <circle cx="0" cy="-10" r="4" fill="#F97316"/>
  </g>
  <g transform="translate(380, 390)">
    <ellipse cx="0" cy="0" rx="18" ry="7" fill="#78350F"/>
    <path d="M0 0 Q4 -18 0 -26 Q-4 -18 0 0 Z" fill="#FEF08A"/>
    <circle cx="0" cy="-12" r="5" fill="#F97316"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="20" width="220" height="42" rx="12" fill="#000000" opacity="0.6"/>
  <text x="35" y="47" fill="#FEF08A" font-size="18" font-family="sans-serif" font-weight="bold">संध्या अर्घ्य (पहिला अरग)</text>
</svg>