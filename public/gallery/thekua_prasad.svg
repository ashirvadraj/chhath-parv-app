<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="thkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1C0500"/>
    </radialGradient>
    <linearGradient id="thekuaColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#thkBg)"/>

  <!-- Brass Thali Base -->
  <circle cx="250" cy="270" r="195" fill="#CA8A04" stroke="#EAB308" stroke-width="8"/>
  <circle cx="250" cy="270" r="185" fill="#A16207" stroke="#713F12" stroke-width="2"/>

  <!-- Ghee Luster Glow -->
  <circle cx="250" cy="270" r="170" fill="#FEF08A" opacity="0.1"/>

  <!-- Center Thekua (Leaf Pattern - पान पत्ता सांचा) -->
  <g transform="translate(250, 260) rotate(-15)">
    <path d="M-60 0 C-40 -50 40 -50 60 0 C40 50 -40 50 -60 0 Z" fill="url(#thekuaColor)" stroke="#451A03" stroke-width="4"/>
    <!-- Leaf veins carved by wooden saancha -->
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#78350F" stroke-width="4"/>
    <line x1="-20" y1="0" x2="-35" y2="-25" stroke="#78350F" stroke-width="3"/>
    <line x1="-20" y1="0" x2="-35" y2="25" stroke="#78350F" stroke-width="3"/>
    <line x1="10" y1="0" x2="-5" y2="-28" stroke="#78350F" stroke-width="3"/>
    <line x1="10" y1="0" x2="-5" y2="28" stroke="#78350F" stroke-width="3"/>
    <line x1="35" y1="0" x2="25" y2="-22" stroke="#78350F" stroke-width="3"/>
    <line x1="35" y1="0" x2="25" y2="22" stroke="#78350F" stroke-width="3"/>
  </g>

  <!-- Round Floral Thekua (गोल चक्र सांचा) -->
  <g transform="translate(150, 200)">
    <circle cx="0" cy="0" r="45" fill="url(#thekuaColor)" stroke="#451A03" stroke-width="3"/>
    <!-- Floral Stamp Pattern -->
    <circle cx="0" cy="0" r="12" fill="#78350F"/>
    <circle cx="0" cy="-25" r="8" fill="#78350F"/>
    <circle cx="0" cy="25" r="8" fill="#78350F"/>
    <circle cx="-25" cy="0" r="8" fill="#78350F"/>
    <circle cx="25" cy="0" r="8" fill="#78350F"/>
  </g>

  <!-- Another Oval Thekua (लंबा ठेकुआ) -->
  <g transform="translate(350, 220) rotate(25)">
    <path d="M-50 0 C-30 -40 30 -40 50 0 C30 40 -30 40 -50 0 Z" fill="url(#thekuaColor)" stroke="#451A03" stroke-width="3"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#78350F" stroke-width="3"/>
    <line x1="-15" y1="0" x2="-25" y2="-20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="-15" y1="0" x2="-25" y2="20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="15" y1="0" x2="5" y2="-20" stroke="#78350F" stroke-width="2.5"/>
    <line x1="15" y1="0" x2="5" y2="20" stroke="#78350F" stroke-width="2.5"/>
  </g>

  <!-- Bottom Thekua Pieces -->
  <g transform="translate(200, 360) rotate(10)">
    <circle cx="0" cy="0" r="42" fill="url(#thekuaColor)" stroke="#451A03" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="#78350F" stroke="#D97706" stroke-width="2"/>
  </g>
  <g transform="translate(300, 350) rotate(-20)">
    <circle cx="0" cy="0" r="38" fill="url(#thekuaColor)" stroke="#451A03" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#78350F"/>
  </g>

  <!-- Header Banner -->
  <rect x="20" y="20" width="220" height="42" rx="12" fill="#000000" opacity="0.6"/>
  <text x="35" y="47" fill="#FEF08A" font-size="18" font-family="sans-serif" font-weight="bold">पवित्र ठेकुआ महाप्रसाद</text>
</svg>