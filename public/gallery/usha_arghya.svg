<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dawnSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="30%" stop-color="#431407"/>
      <stop offset="65%" stop-color="#BE123C"/>
      <stop offset="85%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <radialGradient id="morningSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Morning Dawn Sky -->
  <rect width="500" height="310" fill="url(#dawnSky)"/>
  <!-- Holy River Dawn Mist -->
  <rect y="310" width="500" height="190" fill="#7C2D12"/>

  <!-- Rising Crimson Sun -->
  <circle cx="250" cy="270" r="160" fill="url(#morningSun)"/>
  <circle cx="250" cy="270" r="60" fill="#FEF08A"/>

  <!-- Golden Sunbeams -->
  <path d="M250 270 L100 80 M250 270 L170 40 M250 270 L250 20 M250 270 L330 40 M250 270 L400 80 M250 270 L450 140 M250 270 L50 140" 
        stroke="#FEF08A" stroke-width="3" opacity="0.4" stroke-dasharray="10,15"/>

  <!-- Water Ripple Rays -->
  <ellipse cx="250" cy="330" rx="80" ry="7" fill="#FEF08A" opacity="0.8"/>
  <ellipse cx="250" cy="360" rx="130" ry="10" fill="#FDE047" opacity="0.7"/>
  <ellipse cx="250" cy="400" rx="170" ry="12" fill="#F59E0B" opacity="0.5"/>

  <!-- Brass Lota Pouring Milk Offering (Arghya) -->
  <g transform="translate(230, 240)">
    <!-- Golden Brass Kalash -->
    <path d="M20 10 L45 10 L50 35 Q55 60 32 60 Q10 60 15 35 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <ellipse cx="32" cy="10" rx="13" ry="5" fill="#FDE047"/>
    <!-- Stream of Holy Milk Offering -->
    <path d="M40 15 Q60 60 70 120" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M42 16 Q62 60 72 120" stroke="#FEF9C3" stroke-width="3" fill="none"/>
  </g>

  <!-- Devotee Standing in Chest-Deep River Water -->
  <path d="M200 330 Q215 280 230 270 Q245 280 260 330 Z" fill="#311042"/>
  <circle cx="230" cy="255" r="14" fill="#311042"/>

  <!-- Header Banner -->
  <rect x="20" y="20" width="220" height="42" rx="12" fill="#000000" opacity="0.6"/>
  <text x="35" y="47" fill="#FEF08A" font-size="18" font-family="sans-serif" font-weight="bold">उषा अर्घ्य (भोरवा अरग)</text>
</svg>